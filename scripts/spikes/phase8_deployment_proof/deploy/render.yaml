# Render blueprint for the Phase 8 deployment proof. NOT APPLIED.
#
# This file is prepared, not deployed: creating the service needs an account action and a
# paid plan (persistent disks are not on the free tier), and neither is something to do on
# somebody's behalf. What the user has to do is listed at the bottom.
#
# Why Render for the first host proof, out of the four that were compared:
#
#   * a persistent process, so an in-process background run outlives the request that
#     started it — the whole point of HARNESS.md section 10's allowance;
#   * a persistent disk, so SQLite is a real option and no managed database has to be
#     chosen before the requirements for one are known;
#   * a declarative blueprint, so the deployment is reviewable as a diff.
#
# Its main constraint is also the reason it fits: a service with a disk cannot scale past one
# instance. For a single-process app holding in-memory run handles that is the correct shape,
# and it is better to have the platform enforce it than to discover it later. It also means
# no zero-downtime deploys — the old instance stops before the new one starts, which will
# interrupt any Bootstrap run in flight. That is the documented process-loss behaviour, not a
# surprise.
#
# Fly.io is the alternative if the single-instance ceiling becomes the binding constraint:
# Fly Volumes attach to Machines the same way, and its request timeout is not documented as a
# platform limit at all. It was not tried here because doing two host proofs at once answers
# neither well.

services:
  - type: web
    name: phase8-deployment-proof
    runtime: python
    plan: starter          # persistent disks require a paid plan
    region: singapore      # closest listed region to the training audience
    autoDeploy: false      # a proof should not redeploy on every push to the harness

    rootDir: scripts/spikes/phase8_deployment_proof
    buildCommand: pip install -r requirements-proof.txt
    # One worker, on purpose: the background run keeps its task handle in this process.
    # --timeout-keep-alive is generous because the status page polls.
    startCommand: >-
      uvicorn proof_app.app:create_app
      --factory
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --timeout-keep-alive 75
      --log-level warning

    healthCheckPath: /

    disk:
      name: proof-state
      mountPath: /var/lib/phase8
      sizeGB: 1

    envVars:
      # Application state only: runs and sessions. No document ever reaches it.
      - key: PROOF_DB_PATH
        value: /var/lib/phase8/proof.sqlite3
      # https in front of the service, so the cookies say so.
      - key: PROOF_COOKIE_SECURE
        value: "1"
      # Generated by Render and never printed by the app — see proof_app/config.py.
      - key: PROOF_CSRF_SECRET
        generateValue: true
      - key: PROOF_SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13"

# ---------------------------------------------------------------------------
# What the user has to do. None of it is done here.
#
#   1. Decide whether this proof is deployed publicly at all. It ingests documents, and a
#      public URL with an upload form is a surface somebody will find.
#   2. Create or choose a Render account and a paid plan (disks are not free).
#   3. Point a Blueprint at this repository with rootDir as above.
#   4. Confirm, after the first deploy, the two numbers this file cannot predict:
#        - the platform's request body ceiling for an upload (locally 8 MB passed; the
#          harness's own IntakePolicy allows 25 MiB, and Vercel's 4.5 MB would fail);
#        - whether a request may stay open long enough for the status page to poll.
#   5. Delete the service when the proof is finished. A proof left running is a service.
# ---------------------------------------------------------------------------
